name: sabeel

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabeel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabeel}
      POSTGRES_DB: ${POSTGRES_DB:-sabeel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sabeel} -d $${POSTGRES_DB:-sabeel}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  zitadel-postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:-sabeel_zitadel_dev}
      POSTGRES_DB: zitadel
    volumes:
      - identity_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    user: "0"
    command: ["start-from-init", "--masterkey", "${ZITADEL_MASTERKEY:-SabeelDevMasterKey1234567890ABCD}"]
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: 127.0.0.1
      ZITADEL_EXTERNALPORT: ${ZITADEL_HTTP_PORT:-8081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_POSTGRES_PASSWORD:-sabeel_zitadel_dev}@zitadel-postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: sabeel-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Sabeel Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_ADMIN_PAT_EXPIRATION:-2099-01-01T00:00:00Z}
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: sabeel-login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Sabeel Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_LOGIN_CLIENT_PAT_EXPIRATION:-2099-01-01T00:00:00Z}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://127.0.0.1:${ZITADEL_HTTP_PORT:-8081}/ui/v2/login/
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLOR: "#1d4236"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLOR: "#dbe3d9"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLOR: "#a64b42"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLOR: "#14221d"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLORDARK: "#c8e05c"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLORDARK: "#14221d"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLORDARK: "#a64b42"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLORDARK: "#f6f5ef"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://127.0.0.1:${ZITADEL_HTTP_PORT:-8081}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://127.0.0.1:${ZITADEL_HTTP_PORT:-8081}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://127.0.0.1:${ZITADEL_HTTP_PORT:-8081}/ui/v2/login/login?samlRequest=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: identity@sabeel.local
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Sabeel Identity
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: identity@sabeel.local
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    volumes:
      - identity_bootstrap_data:/zitadel/bootstrap:rw
    depends_on:
      zitadel-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      EMAIL_VERIFICATION: "true"
      CUSTOM_REQUEST_HEADERS: Host:127.0.0.1:${ZITADEL_HTTP_PORT:-8081},X-Forwarded-Proto:http
    volumes:
      - identity_bootstrap_data:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  zitadel-proxy:
    image: docker.io/library/caddy:2.10.2-alpine
    environment:
      ZITADEL_HTTP_PORT: ${ZITADEL_HTTP_PORT:-8081}
    volumes:
      - ./infra/zitadel/Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z
    ports:
      - "127.0.0.1:${ZITADEL_HTTP_PORT:-8081}:8080"
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    restart: unless-stopped

  zitadel-bootstrap:
    image: sabeel:latest
    entrypoint: ["/app/zitadel-bootstrap"]
    environment:
      ZITADEL_BOOTSTRAP_API_URL: http://zitadel-api:8080
      ZITADEL_BOOTSTRAP_INSTANCE_HOST: 127.0.0.1:${ZITADEL_HTTP_PORT:-8081}
      ZITADEL_BOOTSTRAP_FORWARDED_PROTO: http
      ZITADEL_BOOTSTRAP_PAT_FILE: /zitadel/bootstrap/admin.pat
      ZITADEL_BOOTSTRAP_OUTPUT_DIR: /zitadel/bootstrap/sabeel
      ZITADEL_BOOTSTRAP_PROJECT_NAME: Sabeel
      ZITADEL_BOOTSTRAP_APP_NAME: sabeel-web-dev
      ZITADEL_BOOTSTRAP_REDIRECT_URI: http://localhost:${FRONTEND_PORT:-3000}/auth/callback
      ZITADEL_BOOTSTRAP_LOGOUT_URI: http://localhost:${FRONTEND_PORT:-3000}
      ZITADEL_BOOTSTRAP_DEV_MODE: "true"
    volumes:
      - identity_bootstrap_data:/zitadel/bootstrap:rw
    depends_on:
      zitadel-api:
        condition: service_healthy
    restart: "no"

  migrate:
    image: sabeel:latest
    entrypoint: ["/app/sabeel-migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sabeel}:${POSTGRES_PASSWORD:-sabeel}@postgres:5432/${POSTGRES_DB:-sabeel}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: sabeel:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sabeel}:${POSTGRES_PASSWORD:-sabeel}@postgres:5432/${POSTGRES_DB:-sabeel}?sslmode=disable
      ENVIRONMENT: development
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:5173,http://localhost:5173
      SABEEL_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-3000}
      SABEEL_OIDC_ISSUER: http://127.0.0.1:${ZITADEL_HTTP_PORT:-8081}
      SABEEL_OIDC_INTERNAL_URL: http://zitadel-proxy:8080
      SABEEL_OIDC_CLIENT_ID_FILE: /zitadel/bootstrap/sabeel/client-id
      SABEEL_OIDC_CLIENT_SECRET_FILE: /zitadel/bootstrap/sabeel/client-secret
      SABEEL_OIDC_REDIRECT_URL: http://localhost:${FRONTEND_PORT:-3000}/auth/callback
      SABEEL_OIDC_STATE_KEY: ${SABEEL_OIDC_STATE_KEY:-sabeel-development-state-key-32chars}
      SABEEL_SESSION_SECURE: "false"
    volumes:
      - identity_bootstrap_data:/zitadel/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zitadel-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_SABEEL_API_URL: http://localhost:${FRONTEND_PORT:-3000}
    image: sabeel-frontend:latest
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: docker.io/library/caddy:2.10.2-alpine
    volumes:
      - ./infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_postgres_data:
  identity_postgres_data:
  identity_bootstrap_data:
