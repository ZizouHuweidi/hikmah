name: sabeel-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: sabeel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sabeel
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabeel -d sabeel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  zitadel-postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?set ZITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    user: "0"
    command: ["start-from-init", "--masterkey", "${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY}"]
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${SABEEL_AUTH_DOMAIN:?set SABEEL_AUTH_DOMAIN}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_POSTGRES_PASSWORD}@zitadel-postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: sabeel-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Sabeel Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_ADMIN_PAT_EXPIRATION:-2099-01-01T00:00:00Z}
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: sabeel-login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Sabeel Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_LOGIN_CLIENT_PAT_EXPIRATION:-2099-01-01T00:00:00Z}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${SABEEL_AUTH_DOMAIN}/ui/v2/login/
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLOR: "#1d4236"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLOR: "#dbe3d9"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLOR: "#a64b42"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLOR: "#14221d"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLORDARK: "#c8e05c"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLORDARK: "#14221d"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLORDARK: "#a64b42"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLORDARK: "#f6f5ef"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${SABEEL_AUTH_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${SABEEL_AUTH_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${SABEEL_AUTH_DOMAIN}/ui/v2/login/login?samlRequest=
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: ${ZITADEL_SMTP_HOST:?set ZITADEL_SMTP_HOST}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ${ZITADEL_SMTP_USER:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${ZITADEL_SMTP_PASSWORD:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: ${ZITADEL_SMTP_TLS:-true}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${ZITADEL_SMTP_FROM:?set ZITADEL_SMTP_FROM}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ${ZITADEL_SMTP_FROM_NAME:-Sabeel Identity}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: ${ZITADEL_SMTP_REPLY_TO:?set ZITADEL_SMTP_REPLY_TO}
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.2
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      EMAIL_VERIFICATION: "true"
      CUSTOM_REQUEST_HEADERS: Host:${SABEEL_AUTH_DOMAIN},X-Forwarded-Proto:https
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  zitadel-proxy:
    image: docker.io/library/caddy:2.10.2-alpine
    environment:
      SABEEL_AUTH_DOMAIN: ${SABEEL_AUTH_DOMAIN}
    volumes:
      - ./infra/zitadel/Caddyfile.production:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  zitadel-bootstrap:
    image: ${SABEEL_API_IMAGE:-sabeel:latest}
    entrypoint: ["/app/zitadel-bootstrap"]
    environment:
      ZITADEL_BOOTSTRAP_API_URL: http://zitadel-api:8080
      ZITADEL_BOOTSTRAP_INSTANCE_HOST: ${SABEEL_AUTH_DOMAIN}
      ZITADEL_BOOTSTRAP_FORWARDED_PROTO: https
      ZITADEL_BOOTSTRAP_PAT_FILE: /zitadel/bootstrap/admin.pat
      ZITADEL_BOOTSTRAP_OUTPUT_DIR: /zitadel/bootstrap/sabeel
      ZITADEL_BOOTSTRAP_PROJECT_NAME: Sabeel
      ZITADEL_BOOTSTRAP_APP_NAME: sabeel-web-production
      ZITADEL_BOOTSTRAP_REDIRECT_URI: https://${SABEEL_DOMAIN:?set SABEEL_DOMAIN}/auth/callback
      ZITADEL_BOOTSTRAP_LOGOUT_URI: https://${SABEEL_DOMAIN}
      ZITADEL_BOOTSTRAP_DEV_MODE: "false"
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-api:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  migrate:
    image: ${SABEEL_API_IMAGE:-sabeel:latest}
    entrypoint: ["/app/sabeel-migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://sabeel:${POSTGRES_PASSWORD}@postgres:5432/sabeel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: ${SABEEL_API_IMAGE:-sabeel:latest}
    environment:
      DATABASE_URL: postgres://sabeel:${POSTGRES_PASSWORD}@postgres:5432/sabeel?sslmode=disable
      ENVIRONMENT: production
      PORT: 8080
      CORS_ALLOWED_ORIGINS: https://${SABEEL_DOMAIN}
      SABEEL_PUBLIC_URL: https://${SABEEL_DOMAIN}
      SABEEL_OIDC_ISSUER: https://${SABEEL_AUTH_DOMAIN}
      SABEEL_OIDC_INTERNAL_URL: http://zitadel-proxy:8080
      SABEEL_OIDC_CLIENT_ID_FILE: /zitadel/bootstrap/sabeel/client-id
      SABEEL_OIDC_CLIENT_SECRET_FILE: /zitadel/bootstrap/sabeel/client-secret
      SABEEL_OIDC_REDIRECT_URL: https://${SABEEL_DOMAIN}/auth/callback
      SABEEL_OIDC_STATE_KEY: ${SABEEL_OIDC_STATE_KEY:?set SABEEL_OIDC_STATE_KEY}
      SABEEL_SESSION_SECURE: "true"
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zitadel-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_SABEEL_API_URL: https://${SABEEL_DOMAIN}
    image: ${SABEEL_FRONTEND_IMAGE:-sabeel-frontend:latest}
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  gateway:
    image: docker.io/library/caddy:2.10.2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      SABEEL_DOMAIN: ${SABEEL_DOMAIN}
      SABEEL_AUTH_DOMAIN: ${SABEEL_AUTH_DOMAIN}
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      frontend:
        condition: service_healthy
      zitadel-proxy:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  zitadel_postgres_data:
  zitadel_bootstrap:
  caddy_data:
  caddy_config:
